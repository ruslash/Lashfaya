<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Л.Э.Ш. ФАЯ</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@500;600&display=swap">
<style>
  :root{
    --cream:#ece1cd; --cream-hi:#f7eeda; --ink:#1b0f10;
    --fg:#f2e9db; --muted:#b6a498;
    --panel:rgba(14,9,10,.82); --line:rgba(120,96,86,.4);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000}
  img{max-width:100%}
  [hidden]{display:none!important}

  .stage{
    position:relative; min-height:100svh; background:#000;
    display:flex; flex-direction:column; justify-content:flex-end;
    font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .bg{
    position:absolute; inset:0; z-index:0; width:100%; height:100%;
    object-fit:cover; object-position:center top; pointer-events:none;
  }
  .panel{
    position:relative; z-index:1;
    padding:120px 20px calc(18px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:16px;
    background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.5) 13%,#000 30%,#000 100%);
  }
  .inner{max-width:520px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:16px;}

  .field label{
    display:block; font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:9px; font-weight:600;
  }
  .amount-wrap{position:relative; display:flex; align-items:center;}
  .amount-wrap .cur{
    position:absolute; right:18px; color:var(--muted);
    font-size:20px; pointer-events:none; font-family:"Playfair Display",serif;
  }
  #amount{
    width:100%; padding:18px 44px 18px 18px; border-radius:13px;
    background:rgba(0,0,0,.55); border:1px solid var(--line); color:var(--fg);
    font-family:"Playfair Display",Georgia,serif; font-size:24px; font-weight:700;
    letter-spacing:.01em; outline:none; font-variant-numeric:tabular-nums;
  }
  #amount::placeholder{color:#6f6056; font-weight:600;}
  #amount:focus{border-color:var(--cream);}

  #paymentContainer{min-height:60px;}

  .note{text-align:center; font-size:12.5px; color:var(--muted); letter-spacing:.02em;}
  .status{
    text-align:center; font-size:12.5px; color:var(--muted);
    border:1px dashed var(--line); border-radius:10px; padding:10px 12px; line-height:1.5;
  }
  .status.bad{color:#ff9a8a; border-color:rgba(255,120,100,.5);}
  .status.good{color:#9fe6b4; border-color:rgba(120,230,160,.4);}
  .paylink{
    display:none; text-align:center; text-decoration:none;
    padding:16px; border-radius:12px; background:linear-gradient(180deg,var(--cream-hi),var(--cream));
    color:var(--ink); font-family:"Playfair Display",serif; font-weight:700; font-size:18px;
  }
</style>
</head>

  <div class="panel">
    <div class="inner">

      <div class="field">
        <label for="amount">Сумма оплаты</label>
        <div class="amount-wrap">
          <input id="amount" type="number" inputmode="numeric" min="100" step="1"
                 placeholder="Введите сумму" autocomplete="off">
          <span class="cur">₽</span>
        </div>
      </div>

      <div id="paymentContainer"></div>
      <a class="paylink" id="paylink" href="#" rel="noopener">Перейти к оплате СБП →</a>

      <div class="status" id="status">Загрузка формы оплаты…</div>
      <div class="note">Оплата через Систему быстрых платежей (СБП)</div>

    </div>
  </div>
</div>

<script>
  var statusEl = document.getElementById("status");
  var amountEl = document.getElementById("amount");
  var containerEl = document.getElementById("paymentContainer");
  var paylinkEl = document.getElementById("paylink");
  var MIN_RUB = 100, MAX_RUB = 1000000;

  function showStatus(msg, kind){
    statusEl.textContent = msg || "";
    statusEl.hidden = !msg;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function onPaymentIntegrationLoad() {
    if (typeof PaymentIntegration === "undefined") {
      showStatus("❌ Скрипт оплаты integration.js не загрузился.", "bad");
      return;
    }
    var initConfig = { terminalKey: "1643112119445", product: "eacq", features: { payment: {} } };
    showStatus("Инициализация виджета…");

    PaymentIntegration.init(initConfig)
      .then(async function (integration) {
        var main = await integration.payments.create("lashfaya-sbp", {});
        await main.mount(containerEl);

        await integration.payments.setPaymentStartCallback(async function () {
          paylinkEl.style.display = "none";
          var rub = Math.round(Number(amountEl.value));
          if (!isFinite(rub) || rub < MIN_RUB || rub > MAX_RUB) {
            showStatus("Введите сумму от " + MIN_RUB + " до " + MAX_RUB + " ₽", "bad");
            throw new Error("invalid amount");
          }
          showStatus("Создаём платёж…");
          var res;
          try {
            res = await new PaymentIntegration.Helpers().request("/api/init", "POST", { amount: rub });
          } catch (e) {
            showStatus("❌ Сервер оплаты не ответил: " + (e && e.message ? e.message : e), "bad");
            throw e;
          }
          if (!res || !res.paymentUrl) {
            var msg = (res && res.error) ? res.error : "нет paymentUrl";
            var code = (res && res.code) ? (" (код " + res.code + ")") : "";
            showStatus("❌ Банк отклонил платёж: " + msg + code, "bad");
            throw new Error("init failed");
          }
          // Успех: показываем запасную ссылку и отдаём URL виджету.
          paylinkEl.href = res.paymentUrl;
          paylinkEl.style.display = "block";
          showStatus("✅ Платёж создан. Если оплата не открылась сама — нажмите кнопку «Перейти к оплате СБП».", "good");
          return res.paymentUrl;
        });

        await main.updateWidgetTypes(["sbp"]);
        try {
          await main.updateDisplayParams({ gap: 0.375, hight: 3.5, radius: 0.75, theme: { default: "accent" } });
        } catch (e) {}

        setTimeout(function () {
          if (containerEl.childElementCount === 0 || containerEl.offsetHeight < 20) {
            showStatus("⚠️ Кнопка СБП не появилась — проверьте, включён ли СБП на терминале.", "bad");
          } else {
            showStatus("");
          }
        }, 2500);
      })
      .catch(function (e) {
        showStatus("❌ Ошибка инициализации: " + (e && e.message ? e.message : e), "bad");
      });
  }
  window.onPaymentIntegrationLoad = onPaymentIntegrationLoad;
</script>
<script src="https://integrationjs.t-static.ru/integration.js" onload="onPaymentIntegrationLoad()" async
        onerror="document.getElementById('status').textContent='❌ Не удалось загрузить integration.js с серверов Т-Банка.'"></script>
